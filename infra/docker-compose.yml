# ============================================================
#  docker-compose.yml — local development
#  Production: docker-compose.prod.yml on Oracle ARM VM
# ============================================================
# version: "3.9" What commented out to avoid warning: "attribute 'version' is obsolete"

services:
  fastapi:
      build:
        context: ../backend
        dockerfile: Dockerfile
      env_file: ../.env
# ports What removed Because we want Docker to access the local network on which it is running (needed for nmap to work right)
#    ports:
#      - "127.0.0.1:8000:8000"
      network_mode: "host"     # shares the (now-mirrored) host network instead of the isolated bridge
      volumes:
        - ../backend:/app
      environment:
        - DATABASE_URL=postgresql+asyncpg://dev:dev@localhost:5432/automation_dev
        - DEV_DATABASE_URL=postgresql+asyncpg://dev:dev@localhost:5432/automation_dev
      cap_add:
        - NET_RAW           # lets nmap do real ICMP/ARP discovery without running the process as root
        - NET_ADMIN         # commonly needed alongside NET_RAW for ARP scanning specifically
      depends_on:
        postgres_local:
          condition: service_healthy
      restart: unless-stopped
      mem_limit: 512m
      command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload


#  n8n:
#    image: n8nio/n8n:latest
#    ports:
#      - "5678:5678"
#    volumes:
#      - n8n_data:/home/node/.n8n
#      - ./n8n-workflows:/home/node/.n8n/workflows:ro
#    environment:
#      - N8N_BASIC_AUTH_ACTIVE=true
#      - N8N_BASIC_AUTH_USER=admin
#      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
#      - N8N_HOST=localhost
#      - N8N_PORT=5678
#      - WEBHOOK_URL=http://localhost:5678
#    restart: unless-stopped
#    mem_limit: 512m   # CRITICAL — without this n8n can OOM-kill FastAPI

  postgres_local:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automation_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    #command is used to set PostgreSQL configuration parameters
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c max_connections=30
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dev -d automation_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      #added to avoid error: "pgAdmin4 is running in SERVER_MODE. Please set PGADMIN_CONFIG_SERVER_MODE to False to run in DESKTOP_MODE."
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres_local
    mem_limit: 256m
    profiles: ["tools"]   # only starts with: docker compose --profile tools up

volumes:
#  n8n_data:
  postgres_dev_data:
