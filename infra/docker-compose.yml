# ============================================================
#  docker-compose.yml — local development
#  Production: docker-compose.prod.yml on Oracle ARM VM
# ============================================================
# version: "3.9" What commented out to avoid warning: "attribute 'version' is obsolete"

services:
  fastapi:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres_local:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

#  n8n:
#    image: n8nio/n8n:latest
#    ports:
#      - "5678:5678"
#    volumes:
#      - n8n_data:/home/node/.n8n
#      - ./n8n-workflows:/home/node/.n8n/workflows:ro
#    environment:
#      - N8N_BASIC_AUTH_ACTIVE=true
#      - N8N_BASIC_AUTH_USER=admin
#      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
#      - N8N_HOST=localhost
#      - N8N_PORT=5678
#      - WEBHOOK_URL=http://localhost:5678
#    restart: unless-stopped
#    mem_limit: 512m   # CRITICAL — without this n8n can OOM-kill FastAPI

  postgres_local:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automation_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d automation_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_local
    mem_limit: 256m
    profiles: ["tools"]   # only starts with: docker compose --profile tools up

volumes:
#  n8n_data:
  postgres_dev_data:
