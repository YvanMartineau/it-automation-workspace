events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 5m;

    upstream fastapi_upstream {
        server fastapi:8000;
    }

    # Plain HTTP -> redirect to HTTPS
    server {
        listen 80;
        server_name christian-it-automation.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name christian-it-automation.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/christian-it-automation.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/christian-it-automation.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://fastapi_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://fastapi_upstream/health;
        }

        # n8n deliberately NOT routed here — internal-only,
        # reached via SSH tunnel (ssh -L 5678:localhost:5678 ...), never public.
    }
}