# ============================================================
#  docker-compose.prod.yml — Oracle Cloud VM (Frankfurt, EU)
#  Run from: /opt/it-automation/app/infra/
#  Secrets:  /opt/it-automation/.env  (outside repo, chmod 600, never committed)
#
#  Ingress: nginx listens directly on 80/443 (TLS via Let's Encrypt),
#           DNS via DuckDNS (christian-it-automation.duckdns.org)
#  Scanning: fastapi reaches home LAN via the VM's wg0 WireGuard
#            interface (host-level route), NOT via network_mode: host.
# ============================================================

services:

  fastapi:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: /opt/it-automation/.env
    networks:
      - itautomation_net
    cap_add:
      - NET_RAW      # raw ICMP / SYN scans
      - NET_ADMIN    # commonly needed alongside NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    command: uvicorn main:app --host 0.0.0.0 --port 8000


  postgres:
    image: postgres:16-alpine
    env_file: /opt/it-automation/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automation_prod}
      POSTGRES_USER: ${POSTGRES_USER:-prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c max_connections=30
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - itautomation_net
    restart: always
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prod} -d ${POSTGRES_DB:-automation_prod}"]
      interval: 5s
      timeout: 3s
      retries: 5


  pg_backup:
    image: postgres:16-alpine
    env_file: /opt/it-automation/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automation_prod}
      POSTGRES_USER: ${POSTGRES_USER:-prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backup_data:/backups
    networks:
      - itautomation_net
    depends_on:
      - postgres
    entrypoint: ["sh", "/backup.sh"]
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"


  openldap:
    image: vegardit/openldap:latest
    env_file: /opt/it-automation/.env
    environment:
      - LDAP_INIT_ORG_DN=DC=itautomation,DC=local
      - LDAP_INIT_ORG_NAME=IT Automation Platform
      - LDAP_INIT_ROOT_USER_DN=cn=admin,DC=itautomation,DC=local
      - LDAP_INIT_ROOT_USER_PW=${LDAP_ADMIN_PASSWORD}
      - LDAP_INIT_RFC2307BIS_SCHEMA=1
      - LDAP_TLS_ENABLED=false   # internal Docker-network traffic only
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - itautomation_net
    restart: always
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"


  lam:
    image: ghcr.io/ldapaccountmanager/lam:stable
    env_file: /opt/it-automation/.env
    environment:
      - LAM_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LAM_LANG=en_US
      - LDAP_SERVER=ldap://openldap:389
      - LDAP_DOMAIN=itautomation.local
      - LDAP_BASE_DN=DC=itautomation,DC=local
      - LDAP_USER=cn=admin,DC=itautomation,DC=local
    ports:
      - "127.0.0.1:8080:80"   # loopback only — reach via SSH tunnel
    volumes:
      - lam_config:/var/lib/ldap-account-manager/config
    networks:
      - itautomation_net
    depends_on:
      - openldap
    restart: unless-stopped
    mem_limit: 256m
    profiles: ["tools"]   # only starts with: docker compose --profile tools up -d


  n8n:
    image: n8nio/n8n:latest
    env_file: /opt/it-automation/.env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_WEBHOOK_URL=http://n8n:5678
      - N8N_CALLBACK_SECRET=${N8N_CALLBACK_SECRET}
    ports:
      - "127.0.0.1:5678:5678"   # loopback only — reach via SSH tunnel, not public
    volumes:
      - n8n_data:/home/node/.n8n
      - ../infra/n8n-workflows:/home/node/.n8n/workflows:ro
    networks:
      - itautomation_net
    restart: always
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - itautomation_net
    depends_on:
      fastapi:
        condition: service_healthy
    restart: always
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"


networks:
  itautomation_net:
    driver: bridge


volumes:
  postgres_prod_data:
  backup_data:
  n8n_data:
  ldap_data:
  ldap_config:
  lam_config: