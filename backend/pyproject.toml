[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "S",   # flake8-bandit (security)
  "UP",  # pyupgrade
  "N",   # pep8-naming
]
ignore = [
  "S101",  # allow assert in tests
  "B008",  # FastAPI Depends() in function defaults
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
env_files = [".env.test"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/db/migrations/*"]

[tool.bandit]
exclude_dirs = ["tests", "backend/tests"]