# ============================================================
#  GitHub Actions CI — Project 1 IT Automation Platform
#  Triggers: push and PR to main and development
#  Jobs: backend tests, frontend lint, secret scan
# ============================================================
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  # ── Secret scanning (runs first — fail fast) ───────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend tests ──────────────────────────────────────────
  backend:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    needs: secret-scan
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: automation_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format backend/ --check

      - name: Ruff lint
        run: ruff check backend/ --fix

      - name: Wait for PostgreSQL
        run: |
          python -c "
          import socket, time
          for _ in range(30):
              try:
                  with socket.create_connection(('127.0.0.1', 5432), timeout=1):
                      print('PostgreSQL is up!')
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise TimeoutError('PostgreSQL failed to start in time')
          "

      - name: Pytest with coverage
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 -v
        env:
          DEV_DATABASE_URL: postgresql+asyncpg://testuser:testpass@127.0.0.1:5432/automation_dev
          JWT_SECRET_KEY: ci-test-secret-key-must-be-32-bytes-longx
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "15"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          GRAPH_TENANT_ID: 00000000-0000-0000-0000-000000000000
          GRAPH_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          GRAPH_CLIENT_SECRET: ci-mock-secret
          GRAPH_DEFAULT_GROUP_ID: 00000000-0000-0000-0000-000000000000
          N8N_ONBOARDING_WEBHOOK_URL: http://localhost:5678/webhook/ci-mock
          N8N_WEBHOOK_TIMEOUT_SECONDS: "5"
          GMAIL_OAUTH_CLIENT_ID: ci-mock.apps.googleusercontent.com
          GMAIL_OAUTH_CLIENT_SECRET: ci-mock
          GMAIL_OAUTH_REFRESH_TOKEN: ci-mock
          GMAIL_SENDER_ADDRESS: ci@mock.com
          ADMIN_ALERT_EMAIL: admin@mock.com
          FRONTEND_URL: http://localhost:5173
          ALLOWED_SCAN_SUBNET: 192.168.1.0/24
          APP_ENV: test
          LOG_LEVEL: WARNING

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── Frontend lint & type-check ─────────────────────────────
  frontend:
    name: Frontend Lint & Type-check
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - name: Build verification
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000