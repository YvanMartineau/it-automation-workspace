name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  # ── Secret scanning ─────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend tests ───────────────────────────────────────────
  backend:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    needs: secret-scan
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: automation_dev
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Job-level env: applies to every step below (migrations AND pytest),
    # so both read from one definition instead of two copies that can
    # silently drift apart. get_settings() validates the FULL Settings
    # model at import time — Alembic's env.py calls it too, not just
    # pytest — so every step that touches app code needs the complete set,
    # not just DATABASE_URL/DEV_DATABASE_URL.
    env:
      # settings.py requires DATABASE_URL unconditionally; env.py (Alembic)
      # specifically reads DEV_DATABASE_URL instead — both point at the
      # same service container so either code path resolves correctly.
      DATABASE_URL: postgresql+asyncpg://dev:dev@127.0.0.1:5432/automation_dev
      DEV_DATABASE_URL: postgresql+asyncpg://dev:dev@127.0.0.1:5432/automation_dev

      JWT_SECRET_KEY: ci-test-secret-key-must-be-32-bytes-longx
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

      # IDENTITY_PROVIDER defaults to "ldap" in settings.py, which triggers
      # a model_validator requiring LDAP_BIND_PASSWORD to be non-empty.
      # CI has no LDAP service container, so force the "local" branch.
      IDENTITY_PROVIDER: local

      N8N_ONBOARDING_WEBHOOK_URL: http://localhost:5678/webhook/
      N8N_WEBHOOK_TIMEOUT_SECONDS: "5"

      # Required by settings.py (no default) but never hit a real Gmail
      # account in tests — inert placeholders, not real secrets.
      GMAIL_OAUTH_CLIENT_ID: ci-mock.apps.googleusercontent.com
      GMAIL_OAUTH_CLIENT_SECRET: ci-mock
      GMAIL_OAUTH_REFRESH_TOKEN: ci-mock
      GMAIL_SENDER_ADDRESS: ci@mock.com

      FRONTEND_URL: http://localhost:5173
      ALLOWED_SCAN_SUBNET: 192.168.179.0/24
      APP_ENV: test
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Ruff format check
        run: ruff format backend/ --check

      - name: Ruff lint check
        run: ruff check backend/

      - name: Wait for PostgreSQL
        run: |
          python - << 'EOF'
          import socket, time
          for _ in range(30):
              try:
                  with socket.create_connection(('127.0.0.1', 5432), timeout=1):
                      print('PostgreSQL is up!')
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise TimeoutError('PostgreSQL failed to start in time')
          EOF

      # The postgres service container starts empty — no schema exists
      # until a migration runs. Without this, any test touching a real
      # table (e.g. auth login) fails with UndefinedTableError, not the
      # 401/403 it actually expects.
      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: backend

      - name: Pytest with coverage
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── Frontend lint & type-check ──────────────────────────────
  frontend:
    name: Frontend Lint & Type-check
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Pin TypeScript version
        run: npm install typescript@5.9.3 --save-dev
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type-check (local TS only)
        run: ./node_modules/.bin/tsc --noEmit
        working-directory: frontend

      - name: Build verification
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000